
<div class="reveal" id="addProjectModal" data-reveal>
    <button class="close-button" data-close aria-label="Close modal" type="button">
      <span aria-hidden="true">&times;</span>
    </button>
    <h5>Add Project</h5>
    <div class="modalContent">
      <p class="note-text">All fields are required.</p>
      <div class="grid-x grid-margin-x">
          <div class="cell large-12">
              <div class="floated-label-wrapper">
                  <label for="gn-input">Project Name</label>
                  <input type="text" id="gn-input" name="Project Name" placeholder="Project Name">
              </div>
          </div>
          <div class="cell large-12">
            <div class="floated-label-wrapper">
                <label>Responsible Group</label>
                <select>
                    <option value="" disabled selected>Responsible Group</option>
                    <option>Group 1</option>
                    <option>Group 2</option>
                    <option>Group 3</option>
                </select>
            </div>
        </div>
        <div class="cell large-12">
            <div class="floated-label-wrapper">
                <label>Resource Owner</label>
                <select>
                    <option value="" disabled selected>Resource Owner</option>
                    <option>User 1</option>
                    <option>User 2</option>
                    <option>User 3</option>
                </select>
            </div>
          </div>
          <div class="cell large-12">
            <div class="floated-label-wrapper">
                <label>Cyber-Risk Manager</label>
                <select>
                    <option value="" disabled selected>Cyber-Risk Manager</option>
                    <option>User 1</option>
                    <option>User 2</option>
                    <option>User 3</option>
                </select>
            </div>
          </div>
      </div>
    </div>
    <div class="modalFooter">
      <button class="button hollow secondary" data-close onClick="sib.displaySuccessToast('Project created');">Save &amp; Close</button>
      
      <div class="float-right">
        <button class="button clear secondary" data-close>Cancel</button>
        <button class="button primary secondary" data-close onClick="sib.openURL('edit-project.html'); sib.displaySuccessToast('Project created');">Save &amp; Edit Project</button>
      </div>
    </div>
  </div>
