
<div class="reveal" id="addRoleModal" data-reveal>
  <button class="close-button" data-open="inviteUserModal" aria-label="Close modal" type="button">
    <span aria-hidden="true">&times;</span>
  </button>
  <h5>Add User Role</h5>
  <div class="modalContent">
    <p class="note-text">All required fields are marked with asterisks (<span class="required">*</span>)</p>
    <div class="grid-x">
        <div class="cell large-12">
            <div class="floated-label-wrapper">
              <label>Group *</label>
              <select>
                  <option value="" disabled selected>Group <span class="required">*</span></option>
                  <option>Group 1</option>
                  <option>Group 2</option>
                  <option>Group 3</option>
              </select>
            </div>
        </div>
        <div class="cell large-12">
          <div class="floated-label-wrapper">
            <label>User Role *</label>
            <select>
                <option value="" disabled selected>User Role <span class="required">*</span></option>
                <option>Role 1</option>
                <option>Role 2</option>
                <option>Role 3</option>
            </select>
          </div>
        </div>
        <div class="cell large-12">
          <label class="inline"><input type="checkbox"/> Include Subgroups <span class="has-tip" data-tooltip title="xx"><i class="fas fa-info-circle"></i></span></label>
        </div>
    </div>
  </div>
  <div class="modalFooter float-right">
    <button class="button clear" data-open="inviteUserModal">Cancel</button>
    <button class="button primary" data-open="inviteUserModal" onClick="sib.displaySuccessToast('User Role Added'); window.sib.toggleRolesTables();">Add</button>
  </div>
</div>
