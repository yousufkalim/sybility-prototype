
<div class="reveal" id="saveCommonControlsConfirmationModal" data-reveal>
    <button class="close-button" data-close aria-label="Close modal" type="button">
      <span aria-hidden="true">&times;</span>
    </button>
    <h5>Confirm Action</h5>
    <div class="modalContent">
      <p>Are you sure you wish to save common controls for <span class="bold">Incident Response Services</span>? This will affect all cyber-risk projects that use these common controls.</p>
    </div>
    <div class="modalFooter">
      <div class="float-right">
        <button class="button clear secondary" data-close>Cancel</button>
        <button class="button primary secondary" data-close onClick="sib.displaySuccessToast('Common Controls saved');">Save</button>
      </div>
    </div>
  </div>
