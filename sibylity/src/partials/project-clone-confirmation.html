
<div class="reveal" id="projectCloneConfirmationModal" data-reveal>
    <button class="close-button" data-close aria-label="Close modal" type="button">
      <span aria-hidden="true">&times;</span>
    </button>
    <h5>Confirm Action</h5>
    <div class="modalContent">
      <p>Are you sure you wish to clone this project? The previous version of the project will be archived, and can be restored by deleting the clone. </p>
    </div>
    <div class="modalFooter">
      <div class="float-right">
        <button class="button clear secondary" data-close>Cancel</button>
        <button class="button primary secondary" data-close onClick="sib.displaySuccessToast('Project archived and clone created');">Archive and Clone</button>
      </div>
    </div>
  </div>
