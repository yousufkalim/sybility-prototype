
<div class="reveal" id="projectDeletionConfirmationModal" data-reveal>
    <button class="close-button" data-close aria-label="Close modal" type="button">
      <span aria-hidden="true">&times;</span>
    </button>
    <h5>Confirm Action</h5>
    <div class="modalContent">
      <p>Are you sure you wish delete this project? This action cannot be reversed. </p>
    </div>
    <div class="modalFooter">
      <div class="float-right">
        <button class="button clear secondary" data-close>Cancel</button>
        <button class="button primary secondary" data-close onClick="sib.displaySuccessToast('Project deleted');">Delete Project</button>
      </div>
    </div>
  </div>
