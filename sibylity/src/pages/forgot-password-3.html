    <div class="grid-container">
      <div class="grid-x grid-padding-x">
        <div class="large-12 cell">
          <div class="login-wrapper">
            <div class="callout alert visibility-hidden" data-closable>
                <h5>Authentication Failed</h5>
                <p>Incorrect email address or password. Please check your information and try again.</p>
                <button class="close-button" aria-label="Dismiss alert" type="button" data-close>
                  <span aria-hidden="true">&times;</span>
                </button>
              </div>
            <div class="sib-card login-card">
                <img class="logo-login" src="./assets/img/logo-Sibylity.svg"/>
                <h6 class="small">New Password</h6>
                <p>Enter a new password for the account associated with GeneBelcher@gmail.com</p>
                <form action="login.html" method="GET">
                  <div class="floated-label-wrapper margin-top-2">
                    <label for="new-password">New Password</label>
                    <input type="text" id="new-password" name="code input" placeholder="New Password">
                  </div>
                  <div class="floated-label-wrapper margin-top-1">
                    <label for="confirm-new-password">Confirm New Password</label>
                    <input type="text" id="confirm-new-password" name="code input" placeholder="Confirm New Password">
                  </div>
                  <input class="button expanded login-button" type="submit" value="Update Password">
                </form>
            </div>
          </div>
        </div>
      </div>
    </div>
